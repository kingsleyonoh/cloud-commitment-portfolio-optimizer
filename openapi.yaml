              schema: { $ref: "#/components/schemas/ApiKeyMetadataError" }
  /api/api-keys/rotate:
    post:
      operationId: rotateTenantApiKey
      summary: Atomically revoke one selected API key and issue its replacement
      description: A database-confirmed Tenant Admin user credential may submit five authorized, schema-valid requests per rolling 60 seconds. The selected same-tenant active row is locked, revoked, replaced, and audited in one transaction. The plaintext is serialized once only after commit; retrying an already committed old selection returns the same non-enumerating 404 and writes nothing.
      x-required-action: api_keys.read_rotate
      security:
        - JwtBearer: []
        - AccessCookie: []
      parameters:
        - name: Origin
          in: header
          required: false
          description: Required and exact when AccessCookie is selected.
          schema: { type: string, format: uri }
        - name: Sec-Fetch-Site
          in: header
          required: false
          description: When present with AccessCookie, must be same-origin.
          schema: { type: string, const: same-origin }
        - name: X-CSRF-Token
          in: header
          required: false
          description: Required canonical double-submit proof when AccessCookie is selected.
          schema: { type: string, minLength: 43, maxLength: 43, writeOnly: true }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApiKeyRotationRequest" }
      responses:
        "200":
          description: Exact old/replacement metadata, durable audit row identifier, and one-time plaintext after commit.
          headers:
            X-Request-ID: { $ref: "#/components/headers/RequestId" }
            Cache-Control: { $ref: "#/components/headers/NoStore" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyRotationResponse" }
        "400":
          description: VALIDATION_ERROR for a noncanonical selected key, invalid note, or open body.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyRotationError" }
        "401":
          description: Authentication is missing, conflicting, malformed, or stale. Dual credentials return AUTH_CREDENTIAL_CONFLICT.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyRotationError" }
        "403":
          description: API-key actors, non-admin JWT roles, and inactive actors are forbidden.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyRotationError" }
        "404":
          description: Identical NOT_FOUND for missing, revoked, cross-tenant, or concurrent-loser selections.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyRotationError" }
        "413":
          description: PAYLOAD_TOO_LARGE when the request exceeds 16384 bytes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyRotationError" }
        "429":
          description: Five requests were already admitted for this actor and route in the rolling 60-second window.
          headers:
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyRotationError" }
        "503":
          description: Authentication, credential generation, PostgreSQL, audit, or required shared limiter dependency is unavailable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApiKeyRotationError" }
