# Security-bounded production topology for the API, migration gate, worker, and local dependencies.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ccpo
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d ccpo"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 200

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    stop_grace_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
          pids: 100

  migrate:
    build: .
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: ["node", "dist/scripts/db-migrate.js"]
    environment:
      NODE_ENV: production
      DATABASE_REGION: ${DATABASE_REGION:?DATABASE_REGION is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
          pids: 100

  app:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      NODE_ENV: production
      DEPLOYMENT_REGION: ${DEPLOYMENT_REGION:?DEPLOYMENT_REGION is required}
      DATABASE_REGION: ${DATABASE_REGION:?DATABASE_REGION is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_POOL_MAX: ${DB_POOL_MAX:?DB_POOL_MAX is required}
      DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:?DB_POOL_IDLE_TIMEOUT_MS is required}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:?DB_POOL_CONNECTION_TIMEOUT_MS is required}
      REDIS_URL: redis://redis:6379
      SELF_REGISTRATION_ENABLED: ${SELF_REGISTRATION_ENABLED:-false}
      SELF_REGISTRATION_PRODUCTION_ACK: ${SELF_REGISTRATION_PRODUCTION_ACK:-false}
      REGISTRATION_LIMITER_MODE: ${REGISTRATION_LIMITER_MODE:-redis}
      REGISTRATION_TRUSTED_PROXY_CIDRS: ${REGISTRATION_TRUSTED_PROXY_CIDRS:-}
      REGISTRATION_EDGE_ENFORCES_LIMIT: ${REGISTRATION_EDGE_ENFORCES_LIMIT:-false}
      USERS_LIMITER_MODE: ${USERS_LIMITER_MODE:-redis}
      USERS_TRUSTED_EDGE_ACK: ${USERS_TRUSTED_EDGE_ACK:-false}
      USERS_TRUSTED_PROXY_CIDRS: ${USERS_TRUSTED_PROXY_CIDRS:-}
      PUBLIC_BASE_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      JWT_PRIVATE_KEY_PATH: /run/config/jwt-private.pem
      JWT_PUBLIC_KEY_PATH: /run/config/jwt-public.pem
      JWT_ACCESS_TOKEN_MAX_LIFETIME_SECONDS: ${JWT_ACCESS_TOKEN_MAX_LIFETIME_SECONDS:-900}
      JWT_CLOCK_TOLERANCE_SECONDS: ${JWT_CLOCK_TOLERANCE_SECONDS:-30}
      AUTH_ARGON_CONCURRENCY: ${AUTH_ARGON_CONCURRENCY:-2}
      AUTH_ARGON_QUEUE_LIMIT: ${AUTH_ARGON_QUEUE_LIMIT:-32}
      AUTH_LIMITER_MODE: redis
      AUTH_TRUSTED_PROXY_CIDRS: ${AUTH_TRUSTED_PROXY_CIDRS:-}
      AUTH_COOKIE_SECURE: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    volumes:
      - app_objects:/app/.data
      - ${JWT_PRIVATE_KEY_PATH:?JWT_PRIVATE_KEY_PATH is required}:/run/config/jwt-private.pem:ro
      - ${JWT_PUBLIC_KEY_PATH:?JWT_PUBLIC_KEY_PATH is required}:/run/config/jwt-public.pem:ro
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 200

  worker:
    build: .
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    command: ["node", "dist/apps/worker/server.js"]
    environment:
      NODE_ENV: production
      PUBLIC_BASE_URL: ${APP_PUBLIC_URL:?APP_PUBLIC_URL is required}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?ALLOWED_ORIGINS is required}
      DEPLOYMENT_REGION: ${DEPLOYMENT_REGION:?DEPLOYMENT_REGION is required}
      DATABASE_REGION: ${DATABASE_REGION:?DATABASE_REGION is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_POOL_MAX: ${DB_POOL_MAX:?DB_POOL_MAX is required}
      DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:?DB_POOL_IDLE_TIMEOUT_MS is required}
      DB_POOL_CONNECTION_TIMEOUT_MS: ${DB_POOL_CONNECTION_TIMEOUT_MS:?DB_POOL_CONNECTION_TIMEOUT_MS is required}
      REDIS_URL: redis://redis:6379
      OBJECT_STORAGE_MODE: local
      OBJECT_STORAGE_PATH: /app/.data/objects
      REPORT_STORAGE_PATH: /app/.data/reports
      PRICE_FIXTURE_PATH: /app/tests/fixtures/pricing
      JWT_PUBLIC_KEY_PATH: /run/config/jwt-public.pem
      JWT_PRIVATE_KEY_PATH: /run/config/jwt-private.pem
      JWT_ISSUER: ${JWT_ISSUER:?JWT_ISSUER is required}
      JWT_AUDIENCE: ${JWT_AUDIENCE:?JWT_AUDIENCE is required}
      AUTH_LIMITER_MODE: redis
      AUTH_COOKIE_SECURE: "true"
      USERS_LIMITER_MODE: redis
      NOTIFICATION_HUB_ENABLED: ${NOTIFICATION_HUB_ENABLED:-false}
      NOTIFICATION_HUB_URL: ${NOTIFICATION_HUB_URL:-http://notification-hub:3847}
      NOTIFICATION_HUB_API_KEY: ${NOTIFICATION_HUB_API_KEY:-}
      WORKFLOW_ENGINE_ENABLED: ${WORKFLOW_ENGINE_ENABLED:-false}
      WORKFLOW_ENGINE_URL: ${WORKFLOW_ENGINE_URL:-https://workflows.kingsleyonoh.com}
      WORKFLOW_ENGINE_API_KEY: ${WORKFLOW_ENGINE_API_KEY:-}
      WORKFLOW_APPROVAL_WORKFLOW_ID: ${WORKFLOW_APPROVAL_WORKFLOW_ID:-}
      INVOICE_RECON_ENABLED: false
      INVOICE_RECON_CONTRACT_VERIFIED: false
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - app_objects:/app/.data
      - ${JWT_PRIVATE_KEY_PATH:?JWT_PRIVATE_KEY_PATH is required}:/run/config/jwt-private.pem:ro
      - ${JWT_PUBLIC_KEY_PATH:?JWT_PUBLIC_KEY_PATH is required}:/run/config/jwt-public.pem:ro
    tmpfs:
      - /tmp
    stop_grace_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
          pids: 200

volumes:
  postgres_data:
  redis_data:
  app_objects:
